version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jitacm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jitacm_admin
      POSTGRES_PASSWORD: jitacm_dev_password
      POSTGRES_DB: jitacm_events
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./server/src/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jitacm_admin -d jitacm_events"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jitacm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
